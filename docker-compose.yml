services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      # Read from the host's GIT_COMMIT env var — scripts/compose-up.ps1 sets
      # this from `git rev-parse HEAD` for local dev; CI sets it to
      # github.sha. Without it, this defaults to empty and the image falls
      # back to Dockerfile.api's own ARG default ("unknown").
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
