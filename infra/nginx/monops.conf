# HTTP-only vhost for mikejennings.dev. THIS IS A FIRST-BOOT TEMPLATE ONLY.
# infra/user_data.sh copies it into /etc/nginx/sites-available/monops exactly
# once, at first boot. `sudo certbot --nginx -d mikejennings.dev`
# (docs/deployment-runbook.md, step 6) then edits that *deployed* file in
# place, adding a 443/TLS server block and an 80->443 redirect once DNS
# actually points here -- don't hand-add TLS to this template before that;
# certbot's http-01 challenge needs port 80 answering as plain HTTP first.
#
# Once certbot has run, the deployed vhost is CERTBOT-MANAGED and has diverged
# from this file. Never copy this template over it: that deletes the TLS
# config and takes the site down with ERR_CONNECTION_REFUSED (this happened
# 2026-09-06; recovered with
# `sudo certbot install --nginx --cert-name mikejennings.dev`). Post-boot
# nginx changes are hand-applied to the deployed file on the instance, then
# `sudo nginx -t && sudo systemctl reload nginx` -- nginx config does not
# ship via `git pull`. This template only exists to stand up a *fresh*
# instance correctly.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Workstream 2d (docs/plans/2026-09-02-remediation-pass.md): rate-limit the
# public demo. This file is included from within the `http{}` context via
# Ubuntu's default nginx.conf (`include /etc/nginx/sites-enabled/*;`, same
# place the map{} above already lives) -- limit_req_zone is valid here
# directly, no separate conf.d snippet needed.
#
# Exempts Streamlit's websocket upgrade requests rather than rate-limiting
# them: nginx's own documented behavior for limit_req_zone is that a request
# whose key evaluates to an empty string is not subject to the limit at all,
# so this map produces an empty key specifically for Upgrade: websocket
# requests, and the real client IP for everything else. Without this,
# Streamlit's persistent reactivity channel would stutter under the same
# per-request budget as ordinary page/asset loads.
map $http_upgrade $monops_limit_key {
    default   $binary_remote_addr;
    websocket "";
}
limit_req_zone $monops_limit_key zone=monops_zone:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mikejennings.dev;

    # Nothing else lives at the apex yet -- this is a placeholder, not the
    # app. Replace this location block with a real site later without
    # touching /monops below.
    root /var/www/monops-placeholder;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # Workstream 2e: robots.txt is host-wide by nature (there's only ever one
    # per origin) -- revisit this block, not add a second one, if a real site
    # ever lands at the apex. The file itself is laid down by
    # infra/user_data.sh alongside the placeholder index.html; this is a
    # hygiene measure against indexing/casual scraping, not access control --
    # the rate limit above is the actual defence against volume, and nothing
    # stops a scraper that simply ignores this file.
    location = /robots.txt {
        try_files /robots.txt =404;
    }

    # Streamlit issues its own redirect from the bare "/monops" (no trailing
    # slash) to "/monops/", so its own relative asset URLs resolve correctly
    # underneath it -- but it builds that redirect using the protocol IT
    # thinks it's running under (plain HTTP, since that's literally what the
    # container listens on inside Docker), not necessarily the client-facing
    # protocol nginx terminated. Confirmed via a real deployment: behind TLS,
    # Streamlit's own redirect pointed back at http://, downgrading an HTTPS
    # request instead of staying on HTTPS. Rather than depend on Streamlit
    # trusting X-Forwarded-Proto (no confirmed way to make it do so), nginx
    # handles this exact redirect itself, using $scheme -- which is always
    # correct for the actual current connection, never delegated to the
    # upstream app. This exact-match location takes priority over the
    # prefix-match one below for this one specific URI.
    location = /monops {
        # Workstream 2e: always, so the header still lands on error
        # responses -- and note for future maintainers: add_header inside a
        # location block REPLACES any inherited add_header set at a wider
        # scope, it doesn't extend it. If this server block ever grows its
        # own add_header elsewhere, that one needs restating here too.
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 $scheme://$host/monops/;
    }

    # Streamlit code-splits its frontend into ~150 lazily imported chunks, all
    # fetched in one burst on first paint. The /monops limit_req (burst=20)
    # rejected the excess with 503, which the browser surfaces as "Failed to
    # fetch dynamically imported module" -- the site was broken for every
    # cold-cache visitor and fine for anyone who already had the chunks, so it
    # survived days of local use and CI. Static assets are cheap to serve and
    # every expensive operation is behind the action secret, so they are not
    # rate-limited. Confirmed against a real cold load, 2026-09-07.
    location /monops/static/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Monops itself: reverse-proxied to the Streamlit container, which is
    # told to run under this same /monops baseUrlPath via
    # docker-compose.prod.yml's command override (not the shared
    # Dockerfile.streamlit, so local dev at "/" is untouched).
    #
    # The FastAPI service (port 8000) is deliberately never exposed here --
    # Streamlit reaches it over the internal Docker Compose network, not
    # through this reverse proxy.
    location /monops {
        # Workstream 2d: see the limit_req_zone definition above for the
        # websocket-exemption reasoning. burst raised from 20 to 100 on
        # 2026-09-07 -- 20 was below the count of frontend chunks a fresh
        # Streamlit page pulls, so a cold-cache visitor hit the limit on the
        # dynamic imports that /monops/static/ above now serves unlimited
        # anyway; 100 is headroom for any non-static burst without weakening
        # the real defence, which is that every expensive action is gated.
        limit_req zone=monops_zone burst=100 nodelay;

        # Workstream 2e: same always/replaces-not-extends note as the exact-
        # match /monops redirect above.
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket upgrade for Streamlit's live-reactivity channel, while
        # still serving plain HTTP requests correctly (the map{} block
        # above picks the right Connection value per-request -- setting
        # Connection unconditionally to "upgrade" would break normal
        # requests, and unconditionally to "keep-alive" breaks the
        # websocket, which is the actual symptom of a naive copy-paste here).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
