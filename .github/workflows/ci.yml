name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Structural validation (Epic H)
        run: python -m entity_screening.cli validate

      - name: Run test suite
        run: pytest -q

  # A separate, heavier job from `test` above -- same pattern as `docker` below.
  # `test` only installs requirements.txt, so tests/test_topic_similarity_real_model.py
  # skips itself there (sentence-transformers/torch aren't installed). That guard
  # exists so `test` doesn't fail on a dependency it was never meant to have, but a
  # skip guard alone would leave this file's actual regression check never run
  # anywhere in CI -- this job is what makes sure it still is, for real.
  vss-real-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-vss.txt

      - name: Install dependencies (CPU-only torch, then requirements-vss.txt)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-vss.txt

      - name: Run the real-model topic-similarity regression guard
        run: pytest tests/test_topic_similarity_real_model.py -q -v

  docker:
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml's api service reads this to pass GIT_COMMIT
      # through as a build arg (see Dockerfile.api) — without it, the image
      # builds fine but RunManifest.git_commit reads null, exactly the bug
      # this env var exists to prevent. Locally, scripts/compose-up.ps1 sets
      # the equivalent value from `git rev-parse HEAD`.
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API container to report healthy
        run: |
          timeout 60 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q api)")" = "healthy" ]; do
              sleep 2
            done
          '

      # This is the check that actually catches the regression that shipped
      # once already: both containers can be "up" while the UI container
      # still can't resolve the API by its compose service name. Exec into
      # the streamlit container and hit the api service exactly the way
      # app.py does — over the compose network, by service name, not by
      # localhost or from the CI runner's own host network.
      - name: Confirm the UI container can reach the API by its compose service name
        run: docker compose exec -T streamlit curl -sf http://api:8000/health

      # A passing health check only proves the network path exists, not that
      # the pipeline behind it works — run a real screening job through the
      # container split, against the fixtures already committed in the repo,
      # and assert the actual expected result counts.
      - name: Run a real screening job through the container split
        run: |
          response=$(curl -sf -X POST http://localhost:8000/runs \
            -H "Content-Type: application/json" \
            -d '{"nsf_file": "tests/fixtures/sample_nsf_awards.json", "opensanctions_file": "tests/fixtures/sample_opensanctions_targets.csv"}')
          echo "$response"
          echo "$response" | jq -e '.entities_count == 2 and .hits_count == 1'

          # Not just "doesn't crash" — the reproducibility guarantee itself
          # has to actually hold in the exact environment this project
          # deploys to. GIT_COMMIT was baked into the api image at build
          # time (the env: block above); confirm the manifest it produced
          # actually reflects that, not a null fallen back to silently.
          run_id=$(echo "$response" | jq -r '.run_id')
          manifest=$(curl -sf "http://localhost:8000/runs/$run_id/manifest")
          echo "$manifest"
          echo "$manifest" | jq -e --arg sha "$GITHUB_SHA" '.git_commit == $sha'

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
