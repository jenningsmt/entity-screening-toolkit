name: LLM explanation real-model regression guard

# Epic J's real-model calibration/regression guard
# (tests/test_explanation_real_model.py), split into its own workflow file
# rather than a job in ci.yml because GitHub Actions path filters apply at
# the workflow's `on:` trigger, not per-job -- a job inside ci.yml would
# still run on every push regardless of what changed. Triggered on changes
# under entity_screening/explanation/ (where a prompt/model change would
# live) plus a weekly schedule, so silent model-behavior drift with no code
# change at all still gets caught -- unlike tests/test_topic_similarity_
# real_model.py's vss-real-model job (ci.yml), which runs on every push
# because it downloads a free, deterministic local model with no marginal
# cost per run. This job spends real money on a live external call every
# time it runs, so its trigger is deliberately narrower, not because the
# skip-guard-plus-dedicated-job structure itself changed -- see that job's
# own comment in ci.yml and tests/test_explanation_real_model.py's
# docstring for the shared precedent.

on:
  push:
    branches: [main, master]
    paths:
      - "entity_screening/explanation/**"
      - "entity_screening/common/schema.py"
      - "entity_screening/case/demo.py"
      - "tests/fixtures/demo_case/**"
      - "tests/test_explanation_real_model.py"
      - "requirements.txt"
      - ".github/workflows/llm-explanation-real-model.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "entity_screening/explanation/**"
      - "entity_screening/common/schema.py"
      - "entity_screening/case/demo.py"
      - "tests/fixtures/demo_case/**"
      - "tests/test_explanation_real_model.py"
      - "requirements.txt"
      - ".github/workflows/llm-explanation-real-model.yml"
  schedule:
    # Weekly backstop: catches a live model-behavior change even when
    # nothing in this repo changed at all.
    - cron: "0 13 * * 1"

jobs:
  llm-explanation-real-model:
    runs-on: ubuntu-latest
    # No key configured (e.g. a fork's PR, which never sees repo secrets) ->
    # tests/test_explanation_real_model.py's own skip guard handles it
    # (skipped, not failed).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the real-model explanation regression guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/test_explanation_real_model.py -q -v

      # M20: pytest exits 0 on a skip, so an unset secret otherwise
      # produces a plain green check indistinguishable from "ran and
      # passed" unless someone opens the raw log -- this makes the skip
      # visible in the Actions UI (run summary, PR checks tab) without
      # failing the job. An unset secret on a portfolio project is an
      # expected, legitimate state, not a build failure.
      - name: Flag if the calibration test was skipped (no ANTHROPIC_API_KEY)
        if: always()
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::warning::Epic J real-model calibration test skipped -- ANTHROPIC_API_KEY is not set as a repo secret. This run verified nothing about grounding behavior."
          fi
